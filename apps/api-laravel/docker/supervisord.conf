; All three processes in one container, for hosts with a single service
; (Render free plan). Elsewhere run `web`, `relay` and `consume` separately.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:web]
command=hotelpulse octane
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
stopsignal=TERM
stopwaitsecs=30

[program:relay]
command=php artisan hotelpulse:relay --no-ansi
directory=/app
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
stopsignal=TERM
stopwaitsecs=30

[program:consume]
command=php artisan hotelpulse:consume --no-ansi
directory=/app
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
stopsignal=TERM
stopwaitsecs=30
