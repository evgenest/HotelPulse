services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hotelpulse
      POSTGRES_PASSWORD: hotelpulse
      POSTGRES_DB: hotelpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hotelpulse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelpulse -d hotelpulse"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - hotelpulse
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: hotelpulse
      RABBITMQ_DEFAULT_PASS: hotelpulse
    networks:
      - hotelpulse
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      POSTGRES_URI: Host=postgres;Port=5432;Database=hotelpulse;Username=hotelpulse;Password=hotelpulse
      REDIS_URI: redis:6379
      RABBITMQ_URI: amqp://hotelpulse:hotelpulse@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - hotelpulse
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      POSTGRES_URI: Host=postgres;Port=5432;Database=hotelpulse;Username=hotelpulse;Password=hotelpulse
      REDIS_URI: redis:6379
      RABBITMQ_URI: amqp://hotelpulse:hotelpulse@rabbitmq:5672/
    depends_on:
      api:
        condition: service_healthy
    networks:
      - hotelpulse
    restart: on-failure

  web:
    build: ./apps/web
    ports:
      - "3000:3000"
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:8080
    depends_on:
      api:
        condition: service_healthy
    networks:
      - hotelpulse

networks:
  hotelpulse:
    driver: bridge

volumes:
  postgres_data:
