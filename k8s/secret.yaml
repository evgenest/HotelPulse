apiVersion: v1
kind: Secret
metadata:
  name: hotelpulse
  namespace: hotelpulse
type: Opaque
stringData:
  # Local cluster defaults. Replace this Secret before using a shared cluster.
  postgres-uri: Host=postgres;Port=5432;Database=hotelpulse;Username=hotelpulse;Password=hotelpulse
  rabbitmq-uri: amqp://hotelpulse:hotelpulse@rabbitmq:5672/
  rabbitmq-password: hotelpulse
