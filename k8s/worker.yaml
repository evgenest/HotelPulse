apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: hotelpulse
spec:
  selector:
    matchLabels:
      app: worker
  replicas: 1
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: hotelpulse-worker:dev
          imagePullPolicy: Never
          env:
            - name: POSTGRES_URI
              valueFrom:
                secretKeyRef:
                  name: hotelpulse
                  key: postgres-uri
            - name: REDIS_URI
              value: redis:6379
            - name: RABBITMQ_URI
              valueFrom:
                secretKeyRef:
                  name: hotelpulse
                  key: rabbitmq-uri
